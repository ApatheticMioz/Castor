<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" role="img" aria-label="Castor workspace containment and integrity pipeline: path traversal guard, symlink root anchoring, command AST filter, and in-memory syntax gate with rollback." style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="chev" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Title / Header -->
  <g transform="translate(30, 18)">
    <text x="0" y="16" fill="#0f172a" font-size="14" font-weight="800" letter-spacing="0.4">WORKSPACE CONTAINMENT &amp; INTEGRITY PIPELINE</text>
    <text x="0" y="32" fill="#334155" font-size="11">Zero-trust path containment, AST command filtering, and in-memory syntax verification</text>
  </g>

  <!-- The 4 Stages -->
  <g transform="translate(30, 56)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="212" height="118" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="20" cy="22" r="11" fill="#0284c7"/>
      <text x="20" y="26" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">1</text>
      <text x="38" y="26" fill="#0f172a" font-size="13" font-weight="800">Path Traversal Guard</text>
      <line x1="10" y1="38" x2="202" y2="38" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="58" fill="#334155" font-size="10.5">Path normalization:</text>
      <text x="12" y="74" fill="#334155" font-size="10.5">../ traversal and</text>
      <text x="12" y="90" fill="#334155" font-size="10.5">device namespace protection</text>
      <text x="12" y="108" fill="#64748b" font-size="9.5">Escapes rejected before any I/O</text>
    </g>

    <!-- Arrow 1→2 -->
    <line x1="216" y1="60" x2="232" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Stage 2 -->
    <g transform="translate(234, 0)">
      <rect width="212" height="118" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="20" cy="22" r="11" fill="#0284c7"/>
      <text x="20" y="26" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">2</text>
      <text x="38" y="26" fill="#0f172a" font-size="13" font-weight="800">Symlink &amp; Root Anchor</text>
      <line x1="10" y1="38" x2="202" y2="38" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="58" fill="#334155" font-size="10.5">Realpath boundary resolution</text>
      <text x="12" y="74" fill="#334155" font-size="10.5">locks execution strictly</text>
      <text x="12" y="90" fill="#334155" font-size="10.5">inside the workspace</text>
      <text x="12" y="108" fill="#64748b" font-size="9.5">Symlink breakouts refused</text>
    </g>

    <!-- Arrow 2→3 -->
    <line x1="450" y1="60" x2="466" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Stage 3 -->
    <g transform="translate(468, 0)">
      <rect width="212" height="118" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="20" cy="22" r="11" fill="#0284c7"/>
      <text x="20" y="26" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">3</text>
      <text x="38" y="26" fill="#0f172a" font-size="13" font-weight="800">Command AST Filter</text>
      <line x1="10" y1="38" x2="202" y2="38" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="58" fill="#334155" font-size="10.5">Destructive commands and</text>
      <text x="12" y="74" fill="#334155" font-size="10.5">dangerous shell patterns</text>
      <text x="12" y="90" fill="#334155" font-size="10.5">neutralized</text>
      <text x="12" y="108" fill="#64748b" font-size="9.5">AST-level parsing, not string scan</text>
    </g>

    <!-- Arrow 3→4 -->
    <line x1="684" y1="60" x2="700" y2="60" stroke="#059669" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Stage 4 (Syntax Gate) -->
    <g transform="translate(702, 0)">
      <rect width="212" height="118" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
      <circle cx="20" cy="22" r="11" fill="#059669"/>
      <text x="20" y="26" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">4</text>
      <text x="38" y="26" fill="#065f46" font-size="13" font-weight="800">In-Memory Syntax Gate</text>
      <line x1="10" y1="38" x2="202" y2="38" stroke="#a7f3d0" stroke-width="1"/>
      <text x="12" y="58" fill="#1f2937" font-size="10.5">Pre-commit AST validation for</text>
      <text x="12" y="74" fill="#1f2937" font-size="10.5">Rust, TS, JS, Python, JSON —</text>
      <text x="12" y="90" fill="#1f2937" font-size="10.5">rollback on error</text>
      <text x="12" y="108" fill="#059669" font-size="9.5" font-weight="800">Reverts byte-for-byte on failure</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(30, 188)">
    <rect width="940" height="36" rx="8" fill="url(#bannerGrad)"/>
    <text x="470" y="23" fill="#0f172a" font-size="12.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      Guaranteed Workspace Isolation · Clean In-Memory Rollback on Syntax Errors
    </text>
  </g>
</svg>
