<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%" role="img" aria-label="Castor 4-Stage Workspace Containment Pipeline: Path Normalizer, Symlink Lock, Shell AST Filter, and In-Memory Syntax Gate with Rollback" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>

    <!-- Shadow -->
    <filter id="drop2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="960" height="210" rx="14" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="28" fill="#f8fafc" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">WORKSPACE CONTAINMENT &amp; INTEGRITY PIPELINE</text>

  <!-- ==================== 4-STAGE PIPELINE ==================== -->
  <g transform="translate(30, 48)" filter="url(#drop2)">

    <!-- Stage 1: Path Normalizer -->
    <g transform="translate(0, 0)">
      <rect width="195" height="105" rx="12" fill="#131e33" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="97" cy="30" r="16" fill="#0c4a6e"/>
      <text x="97" y="36" fill="#38bdf8" font-size="16" text-anchor="middle">🛑</text>
      <text x="97" y="66" fill="#f0f9ff" font-size="13" font-weight="800" text-anchor="middle">Path Traversal</text>
      <rect x="25" y="74" width="145" height="20" rx="4" fill="#082f49"/>
      <text x="97" y="88" fill="#7dd3fc" font-size="10.5" font-weight="600" text-anchor="middle">Blocks ../ &amp; drive escapes</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="198" y1="52" x2="228" y2="52" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 2: Symlink & Root Lock -->
    <g transform="translate(235, 0)">
      <rect width="195" height="105" rx="12" fill="#131e33" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="97" cy="30" r="16" fill="#0c4a6e"/>
      <text x="97" y="36" fill="#38bdf8" font-size="16" text-anchor="middle">🔒</text>
      <text x="97" y="66" fill="#f0f9ff" font-size="13" font-weight="800" text-anchor="middle">Realpath Anchor</text>
      <rect x="25" y="74" width="145" height="20" rx="4" fill="#082f49"/>
      <text x="97" y="88" fill="#7dd3fc" font-size="10.5" font-weight="600" text-anchor="middle">Locks execution inside tree</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="433" y1="52" x2="463" y2="52" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Stage 3: Shell AST Filter -->
    <g transform="translate(470, 0)">
      <rect width="195" height="105" rx="12" fill="#131e33" stroke="#0284c7" stroke-width="1.4"/>
      <circle cx="97" cy="30" r="16" fill="#0c4a6e"/>
      <text x="97" y="36" fill="#38bdf8" font-size="16" text-anchor="middle">🛡️</text>
      <text x="97" y="66" fill="#f0f9ff" font-size="13" font-weight="800" text-anchor="middle">Command Filter</text>
      <rect x="25" y="74" width="145" height="20" rx="4" fill="#082f49"/>
      <text x="97" y="88" fill="#7dd3fc" font-size="10.5" font-weight="600" text-anchor="middle">AST blocks rm -rf &amp; bombs</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="668" y1="52" x2="698" y2="52" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-emerald)"/>

    <!-- Stage 4: In-Memory AST Gate -->
    <g transform="translate(705, 0)">
      <rect width="195" height="105" rx="12" fill="#0c2e26" stroke="#10b981" stroke-width="1.8"/>
      <circle cx="97" cy="30" r="16" fill="#064e3b"/>
      <text x="97" y="36" fill="#34d399" font-size="16" text-anchor="middle">↩️</text>
      <text x="97" y="66" fill="#ecfdf5" font-size="13" font-weight="800" text-anchor="middle">In-Memory AST Gate</text>
      <rect x="20" y="74" width="155" height="20" rx="4" fill="#065f46"/>
      <text x="97" y="88" fill="#a7f3d0" font-size="10.5" font-weight="700" text-anchor="middle">Syntax Error → Auto Rollback</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(30, 168)">
    <rect width="900" height="26" rx="6" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
    <text x="450" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">
      ✓ Zero-Trust Boundary  ·  ✓ Safe Native Shell  ·  ✓ In-Memory Syntax Rollback Before Disk Commit
    </text>
  </g>
</svg>