<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%" role="img" aria-label="Castor workspace containment and integrity pipeline: path traversal guard, symlink root anchoring, command AST filter, and in-memory syntax gate with rollback." style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <marker id="chev" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <marker id="chev-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card Container -->
  <rect width="1000" height="250" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Title / Header -->
  <g transform="translate(32, 20)">
    <text x="0" y="16" fill="#f8fafc" font-size="14" font-weight="800" letter-spacing="0.6">WORKSPACE CONTAINMENT &amp; INTEGRITY PIPELINE</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" font-weight="500">Zero-trust path containment, AST command filtering, and in-memory syntax verification</text>
  </g>

  <!-- The 4 Stages -->
  <g transform="translate(32, 60)" filter="url(#cardShadow)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="212" height="114" rx="10" fill="#131e33" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="10" fill="#0284c7"/>
      <text x="22" y="26" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">1</text>
      <text x="38" y="26" fill="#e0f2fe" font-size="12" font-weight="800">Path Traversal</text>
      <line x1="12" y1="38" x2="200" y2="38" stroke="#1e3a5f" stroke-width="1"/>
      <text x="14" y="56" fill="#cbd5e1" font-size="10">Canonical path normalization:</text>
      <text x="14" y="71" fill="#cbd5e1" font-size="10">../ traversal &amp; device namespaces</text>
      <text x="14" y="86" fill="#cbd5e1" font-size="10">refused before any filesystem I/O</text>
      <text x="14" y="102" fill="#38bdf8" font-size="9" font-weight="600">Neutralizes breakout attempts</text>
    </g>

    <!-- Arrow 1→2 -->
    <line x1="216" y1="57" x2="228" y2="57" stroke="#38bdf8" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Stage 2 -->
    <g transform="translate(232, 0)">
      <rect width="212" height="114" rx="10" fill="#131e33" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="10" fill="#0284c7"/>
      <text x="22" y="26" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">2</text>
      <text x="38" y="26" fill="#e0f2fe" font-size="12" font-weight="800">Symlink &amp; Root Lock</text>
      <line x1="12" y1="38" x2="200" y2="38" stroke="#1e3a5f" stroke-width="1"/>
      <text x="14" y="56" fill="#cbd5e1" font-size="10">Realpath boundary resolution</text>
      <text x="14" y="71" fill="#cbd5e1" font-size="10">locks execution strictly inside root;</text>
      <text x="14" y="86" fill="#cbd5e1" font-size="10">blocks deletion of workspace tree</text>
      <text x="14" y="102" fill="#38bdf8" font-size="9" font-weight="600">Out-of-tree symlinks blocked</text>
    </g>

    <!-- Arrow 2→3 -->
    <line x1="448" y1="57" x2="460" y2="57" stroke="#38bdf8" stroke-width="2" marker-end="url(#chev)"/>

    <!-- Stage 3 -->
    <g transform="translate(464, 0)">
      <rect width="212" height="114" rx="10" fill="#131e33" stroke="#0284c7" stroke-width="1.2"/>
      <circle cx="22" cy="22" r="11" fill="#0284c7"/>
      <text x="22" y="26" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">3</text>
      <text x="38" y="26" fill="#e0f2fe" font-size="12" font-weight="800">Command AST Filter</text>
      <line x1="12" y1="38" x2="200" y2="38" stroke="#1e3a5f" stroke-width="1"/>
      <text x="14" y="56" fill="#cbd5e1" font-size="10">Destructive commands &amp; shell</text>
      <text x="14" y="71" fill="#cbd5e1" font-size="10">injection patterns neutralized;</text>
      <text x="14" y="86" fill="#cbd5e1" font-size="10">natively permits safe git/python</text>
      <text x="14" y="102" fill="#38bdf8" font-size="9" font-weight="600">AST parsing, not regex strings</text>
    </g>

    <!-- Arrow 3→4 -->
    <line x1="680" y1="57" x2="692" y2="57" stroke="#34d399" stroke-width="2" marker-end="url(#chev-green)"/>

    <!-- Stage 4 (Syntax Gate) -->
    <g transform="translate(696, 0)">
      <rect width="240" height="114" rx="10" fill="#0f2622" stroke="#059669" stroke-width="1.4"/>
      <circle cx="22" cy="22" r="10" fill="#059669"/>
      <text x="22" y="26" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">4</text>
      <text x="38" y="26" fill="#a7f3d0" font-size="12" font-weight="800">In-Memory AST Gate</text>
      <line x1="12" y1="38" x2="228" y2="38" stroke="#064e3b" stroke-width="1"/>
      <text x="14" y="56" fill="#e2e8f0" font-size="10">Pre-commit AST syntax check</text>
      <text x="14" y="71" fill="#e2e8f0" font-size="10">Rust, TS, JS, Python, JSON</text>
      <text x="14" y="86" fill="#e2e8f0" font-size="10">Syntax errors aborted in-memory</text>
      <text x="14" y="102" fill="#34d399" font-size="9" font-weight="700">Byte-for-byte automatic rollback</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <g transform="translate(32, 190)">
    <rect width="936" height="34" rx="8" fill="#131b2e" stroke="#253552" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 928 0 Q 936 0 936 8 L 936 10 L 0 10 Z" fill="url(#bannerGrad)"/>
    <text x="468" y="24" fill="#f8fafc" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.4">
      Guaranteed Workspace Containment · Safe Native Shell · Clean Rollback on Syntax Errors
    </text>
  </g>
</svg>