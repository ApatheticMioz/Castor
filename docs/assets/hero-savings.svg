<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Castor cuts agentic coding cost by 99.85%</title>
  <desc id="d">Over 63 days and 2.31 billion tokens of real agentic coding, the same workload would have cost $5,039.32 at Claude Sonnet 5 API rates. With Castor running the tool loop on a local GPU, it cost $7.53 in electricity.</desc>
  <style>
    .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .num  { font-variant-numeric: tabular-nums; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .pop  { animation: fade .5s ease-out 1.2s both; }
    .rise { animation: rise .7s ease-out .15s both; }
    .late { animation: fade .6s ease-out 1.5s both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .grow, .pop, .rise, .late {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="cloud" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="1199" height="559" rx="20" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="20" fill="url(#glow)"/>

  <!-- Header -->
  <text x="56" y="62" class="sans" font-size="18" font-weight="800" letter-spacing="5" fill="#e6edf3">CASTOR</text>
  <text x="1144" y="62" class="sans" font-size="15" fill="#8b949e" text-anchor="end">Real usage data · 63 days · 2.31 billion tokens</text>

  <!-- Hero number (single focal point) -->
  <g class="rise">
    <text x="52" y="200" class="sans num" font-size="116" font-weight="800" fill="#2dd4bf" letter-spacing="-3">99.85%</text>
    <text x="56" y="248" class="sans" font-size="26" font-weight="600" fill="#e6edf3">cheaper than a cloud-only agent</text>
    <text x="56" y="284" class="sans" font-size="18" fill="#8b949e">Same workload. Same frontier planner.</text>
    <text x="56" y="310" class="sans" font-size="18" fill="#8b949e">The tool loop just runs on your GPU.</text>
  </g>

  <!-- Bar comparison -->
  <text x="600" y="132" class="sans" font-size="16" fill="#8b949e">Cloud-only agent  ·  Claude Sonnet 5 API rates</text>
  <rect class="grow" x="600" y="146" width="544" height="52" rx="10" fill="url(#cloud)"/>
  <text class="sans num pop" x="1126" y="181" font-size="26" font-weight="800" fill="#0d1117" text-anchor="end">$5,039.32</text>

  <text x="600" y="244" class="sans" font-size="16" fill="#8b949e">With Castor  ·  local GPU electricity (41.8 kWh)</text>
  <rect class="pop" x="600" y="258" width="6" height="52" rx="3" fill="#2dd4bf"/>
  <text class="sans num pop" x="622" y="293" font-size="26" font-weight="800" fill="#2dd4bf">$7.53</text>

  <g class="late">
    <text x="600" y="352" class="sans" font-size="20" fill="#e6edf3"><tspan font-weight="800" fill="#2dd4bf">$5,031.79</tspan> saved, roughly <tspan font-weight="800">$80 / day</tspan></text>
  </g>

  <!-- Divider -->
  <line x1="56" y1="392" x2="1144" y2="392" stroke="#30363d"/>

  <!-- Supporting stats strip -->
  <g class="sans num">
    <text x="56"  y="448" font-size="36" font-weight="700" fill="#e6edf3">41,202</text>
    <text x="56"  y="476" font-size="15" fill="#8b949e">agent turns</text>

    <text x="328" y="448" font-size="36" font-weight="700" fill="#e6edf3">56,109</text>
    <text x="328" y="476" font-size="15" fill="#8b949e">tool calls · 96.7% success</text>

    <text x="600" y="448" font-size="36" font-weight="700" fill="#e6edf3">93.7%</text>
    <text x="600" y="476" font-size="15" fill="#8b949e">KV prefix-cache hit rate</text>

    <text x="872" y="448" font-size="36" font-weight="700" fill="#e6edf3">70.7 t/s</text>
    <text x="872" y="476" font-size="15" fill="#8b949e">sustained local decode</text>
  </g>

  <!-- Source line -->
  <text x="56" y="530" class="sans" font-size="13" fill="#6e7681">Source: castor stats telemetry · 4 Sep to 6 Nov 2026 · 993 sessions · 1,188 tasks · power estimated at 250 W, $0.18/kWh</text>
</svg>
