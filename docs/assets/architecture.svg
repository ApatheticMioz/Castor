    <text x="24" y="28" fill="#4c1d95" font-size="15" font-weight="800" letter-spacing="0.3">Layer 1 · Cloud Orchestrator</text>
    <text x="24" y="46" fill="#334155" font-size="12" font-weight="600">Claude Code · Google Antigravity · Cursor</text>

    <g transform="translate(24, 58)">
