        <text x="148" y="19" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">Zero-Config Discovery · /v1/models</text>
      </g>
      <g transform="translate(308, 0)">
        <rect width="296" height="30" rx="7" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
        <text x="148" y="19" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">Adaptive Context &amp; KV Pool Budgeting</text>
