<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" role="img" aria-label="Castor Architecture Diagram: Cloud Frontier and Local Frontier meet at the Castor MCP Bridge" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Cloud Azure Gradient (Left) -->
    <linearGradient id="azureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Local Amber Gradient (Right) -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Center Convergence Gradient (Blue Meets Amber) -->
    <linearGradient id="bridgeStreamTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="52%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="bridgeStreamBottom" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlowAzure" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arr-top" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-bottom" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="420" rx="16" fill="url(#bg)" stroke="#1a2234" stroke-width="1.5"/>

  <!-- Subtle Horizon Bridge Baseline -->
  <line x1="80" y1="200" x2="920" y2="200" stroke="#162032" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ========================================================================= -->
  <!-- THE BRIDGE HIGHWAY: BLUE AND AMBER STREAMS MEETING IN THE MIDDLE           -->
  <!-- ========================================================================= -->

  <!-- Top Highway Stream: Prompt & Task (Cloud -> Castor -> Local) -->
  <path d="M 230 160 Q 500 100 770 160" fill="none" stroke="url(#bridgeStreamTop)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-top)"/>

  <!-- Prompt Dispatch Pill (On the top highway) -->
  <g transform="translate(440, 115)">
    <rect width="120" height="24" rx="12" fill="#0c1524" stroke="url(#bridgeStreamTop)" stroke-width="1.2"/>
    <text x="60" y="16" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">TASK DISPATCH</text>
  </g>

  <!-- Bottom Highway Stream: Verified Diffs (Local -> Castor -> Cloud) -->
  <path d="M 770 240 Q 500 300 230 240" fill="none" stroke="url(#bridgeStreamBottom)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-bottom)"/>

  <!-- Verified Diffs Pill (On the bottom highway) -->
  <g transform="translate(430, 260)">
    <rect width="140" height="24" rx="12" fill="#0c1524" stroke="url(#bridgeStreamBottom)" stroke-width="1.2"/>
    <text x="70" y="16" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">GROUNDED DIFFS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. LEFT HUB: CLOUD FRONTIER (AZURE BLUE)                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(180, 200)">
    <!-- Halo Glow -->
    <circle cx="0" cy="0" r="64" fill="#0c1a30" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="54" fill="#0a1222" stroke="#2563eb" stroke-width="1"/>

    <!-- Cloud & Brain Vector Illustration -->
    <g transform="translate(-24, -18)">
      <!-- Cloud Path -->
      <path d="M 10 24 A 12 12 0 0 1 22 12 A 16 16 0 0 1 44 14 A 12 12 0 0 1 54 26 A 10 10 0 0 1 50 36 L 8 36 A 10 10 0 0 1 10 24 Z" 
            fill="url(#azureGlow)"/>
      <!-- Reasoning Spark -->
      <circle cx="32" cy="23" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Cloud Typography -->
    <text x="0" y="85" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">Cloud Frontier</text>
    <text x="0" y="103" fill="#94a3b8" font-size="11.5" text-anchor="middle">Claude Code · Antigravity · Cursor</text>

    <!-- Capability Pill -->
    <g transform="translate(-75, 114)">
      <rect width="150" height="22" rx="11" fill="#0c1626" stroke="#2563eb" stroke-width="0.8"/>
      <text x="75" y="15" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">High-Reasoning Planning</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CENTER HUB: CASTOR BRIDGE (THE CONVERGENCE JUNCTION)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(500, 200)">
    <!-- Outer Dual-Color Convergence Ring (Blue on Left, Amber on Right) -->
    <!-- Left Azure Arc -->
    <path d="M 0 -58 A 58 58 0 0 0 0 58" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Amber Arc -->
    <path d="M 0 58 A 58 58 0 0 0 0 -58" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Bridge Core Orb -->
    <circle cx="0" cy="0" r="48" fill="#090e17" stroke="#334155" stroke-width="1.5"/>

    <!-- Castor Dioscuri Dyad Emblem (Miniature of logo.svg) -->
    <g transform="translate(-20, -20) scale(0.078)">
      <!-- Azure Arc -->
      <path d="M 416 104 A 215 215 0 0 0 98 119 L 151 172 A 141 141 0 0 1 364 156 Z" fill="url(#azureGlow)"/>
      <!-- Amber Arc -->
      <path d="M 88 132 A 215 215 0 0 0 416 408 L 364 356 A 141 141 0 0 1 142 185 Z" fill="url(#amberGlow)"/>
    </g>

    <!-- Center Typography -->
    <text x="0" y="-72" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.8">CASTOR BRIDGE</text>
    <text x="0" y="-88" fill="#64748b" font-size="10.5" font-weight="600" text-anchor="middle">STDIO MCP RUNTIME</text>

    <!-- Microkernel Core Pillars (Centered Below) -->
    <g transform="translate(-135, 76)">
      <rect width="270" height="24" rx="12" fill="#0b121e" stroke="#1e293b" stroke-width="1"/>
      <text x="135" y="16" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">
        <tspan fill="#38bdf8">DGI Firewall</tspan>
        <tspan fill="#475569">  ·  </tspan>
        <tspan fill="#f8fafc">Zero-Turn Wait</tspan>
        <tspan fill="#475569">  ·  </tspan>
        <tspan fill="#f59e0b">KV Semaphore</tspan>
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RIGHT HUB: LOCAL FRONTIER (AMBER GOLD)                                -->
  <!-- ========================================================================= -->
  <g transform="translate(820, 200)">
    <!-- Halo Glow -->
    <circle cx="0" cy="0" r="64" fill="#1f140a" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="54" fill="#140d06" stroke="#ea580c" stroke-width="1"/>

    <!-- Terminal Monitor Vector Illustration -->
    <g transform="translate(-20, -18)">
      <rect width="40" height="26" rx="4" fill="#0a0704" stroke="url(#amberGlow)" stroke-width="1.5"/>
      <path d="M 16 26 L 13 32 L 27 32 L 24 26 Z" fill="#78350f"/>
      <text x="6" y="13" fill="#fde047" font-size="8" font-family="monospace" font-weight="bold">&gt;_</text>
      <line x1="16" y1="11" x2="32" y2="11" stroke="#f97316" stroke-width="1.2"/>
      <line x1="6" y1="19" x2="26" y2="19" stroke="#60a5fa" stroke-width="1.2"/>
    </g>

    <!-- Local Typography -->
    <text x="0" y="85" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">Local Frontier</text>
    <text x="0" y="103" fill="#94a3b8" font-size="11.5" text-anchor="middle">vLLM · llama.cpp · LM Studio · SGLang</text>

    <!-- In-Tree Tool Loop Pill -->
    <g transform="translate(-100, 114)">
      <rect width="200" height="22" rx="11" fill="#1c0f05" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="100" y="15" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">
        🔄 Tool Loop: read · edit · bash · test
      </text>
    </g>

    <!-- $0 Cost Badge Attached Directly to Local Hub -->
    <g transform="translate(-65, 142)">
      <rect width="130" height="20" rx="5" fill="#451a03" stroke="#d97706" stroke-width="0.8"/>
      <text x="65" y="14" fill="#fef08a" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.4">★ $0 CLOUD TOKENS ★</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. BOTTOM VALUE SUMMARY BAR                                              -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 375)">
    <text x="400" y="16" fill="#64748b" font-size="11.5" font-weight="600" text-anchor="middle">
      <tspan fill="#38bdf8">Cloud reasons once</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#f8fafc">Castor bridges in-process</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#f59e0b">Local engine loops for $0</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#38bdf8">Only verified diffs return to cloud</tspan>
    </text>
  </g>
</svg>