        <rect width="296" height="30" rx="15" fill="#f5f3ff" stroke="#a855f7" stroke-width="1"/>
        <text x="148" y="19" fill="#4c1d95" font-size="11.5" font-weight="700" text-anchor="middle">Architectural Planning &amp; Supervision</text>
      </g>
      <g transform="translate(308, 0)">
        <rect width="296" height="30" rx="15" fill="#f5f3ff" stroke="#a855f7" stroke-width="1"/>
        <text x="148" y="19" fill="#4c1d95" font-size="11.5" font-weight="700" text-anchor="middle">Reviews Grounded Diffs</text>
      </g>
      <g transform="translate(616, 0)">
