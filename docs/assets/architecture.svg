        <text x="110" y="26" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Stream Proxy · :18022</text>
      </g>
      <g transform="translate(690, 0)">
        <rect width="220" height="32" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
        <text x="110" y="20" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">Lean 8-Tool Core + AST/Paper Gates</text>
