  <line x1="500" y1="396" x2="500" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="397" width="248" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
