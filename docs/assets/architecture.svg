  <text x="500" y="48" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">Cloud brain plans · Local engine executes in-tree · $0 Cloud Token Cost</text>
  <line x1="0" y1="58" x2="1000" y2="58" stroke="#cbd5e1" stroke-width="1"/>

