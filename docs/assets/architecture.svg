<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" role="img" aria-label="Castor Architecture Diagram: Cloud Frontier and Local Frontier meet at the Castor MCP Bridge" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Deep Obsidian Canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <!-- Cloud Azure Gradient (Left) -->
    <linearGradient id="azureGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Local Amber Gradient (Right) -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Smooth Continuous Phasing: Blue -> Amber (Top Highway) -->
    <linearGradient id="phaseBlueToAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Smooth Continuous Phasing: Amber -> Blue (Bottom Highway) -->
    <linearGradient id="phaseAmberToBlue" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="35%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="65%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-to-local" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-to-cloud" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="460" rx="16" fill="url(#bg)" stroke="#1a2234" stroke-width="1.5"/>

  <!-- Subtle Horizon Bridge Baseline -->
  <line x1="80" y1="210" x2="920" y2="210" stroke="#141c2c" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ========================================================================= -->
  <!-- HIGHWAY STREAMS: BLUE AND AMBER PHASING INTO EACH OTHER ACROSS THE BRIDGE  -->
  <!-- ========================================================================= -->

  <!-- Top Highway Stream: Prompt & Task (from Cloud x:230, y:160 -> sweeps up -> Local x:770, y:160) -->
  <path d="M 230 160 Q 500 80 770 160" fill="none" stroke="url(#phaseBlueToAmber)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-to-local)"/>

  <!-- Prompt Dispatch Pill (Stationed directly on top highway, clear of center hub) -->
  <g transform="translate(435, 78)" filter="url(#shadow)">
    <rect width="130" height="24" rx="12" fill="#0c1524" stroke="url(#phaseBlueToAmber)" stroke-width="1.2"/>
    <text x="65" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">TASK DISPATCH</text>
  </g>

  <!-- Bottom Highway Stream: Verified Diffs (from Local x:770, y:260 -> sweeps down -> Cloud x:230, y:260) -->
  <path d="M 770 260 Q 500 340 230 260" fill="none" stroke="url(#phaseAmberToBlue)" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-to-cloud)"/>

  <!-- Grounded Diffs Pill (Stationed directly on bottom highway, clear of center hub) -->
  <g transform="translate(425, 342)" filter="url(#shadow)">
    <rect width="150" height="24" rx="12" fill="#0c1524" stroke="url(#phaseAmberToBlue)" stroke-width="1.2"/>
    <text x="75" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">GROUNDED DIFFS</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. LEFT HUB: CLOUD FRONTIER (AZURE BLUE)                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(180, 210)">
    <!-- Halo Glow -->
    <circle cx="0" cy="0" r="60" fill="#0c1a30" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="50" fill="#0a1222" stroke="#2563eb" stroke-width="1"/>

    <!-- Cloud & Brain Vector Illustration -->
    <g transform="translate(-24, -18)">
      <path d="M 10 24 A 12 12 0 0 1 22 12 A 16 16 0 0 1 44 14 A 12 12 0 0 1 54 26 A 10 10 0 0 1 50 36 L 8 36 A 10 10 0 0 1 10 24 Z" 
            fill="url(#azureGlow)"/>
      <circle cx="32" cy="23" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Cloud Typography -->
    <text x="0" y="80" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">Cloud Frontier</text>
    <text x="0" y="98" fill="#94a3b8" font-size="11.5" text-anchor="middle">Claude Code · Antigravity · Cursor</text>

    <!-- Capability Pill -->
    <g transform="translate(-75, 110)">
      <rect width="150" height="22" rx="11" fill="#0c1626" stroke="#2563eb" stroke-width="0.8"/>
      <text x="75" y="15" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">High-Reasoning Planning</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CENTER HUB: CASTOR (WHERE BLUE & AMBER MEET)                          -->
  <!-- ========================================================================= -->
  <g transform="translate(500, 210)">
    <!-- Phasing Outer Convergence Ring (Blue phases smoothly into Amber) -->
    <circle cx="0" cy="0" r="52" fill="#080d16" stroke="url(#phaseBlueToAmber)" stroke-width="2.5" filter="url(#shadow)"/>

    <!-- Core Dioscuri Dyad Emblem -->
    <g transform="translate(-20, -20) scale(0.078)">
      <path d="M 416 104 A 215 215 0 0 0 98 119 L 151 172 A 141 141 0 0 1 364 156 Z" fill="url(#azureGlow)"/>
      <path d="M 88 132 A 215 215 0 0 0 416 408 L 364 356 A 141 141 0 0 1 142 185 Z" fill="url(#amberGlow)"/>
    </g>

    <!-- Title Directly Above Center Hub (Clear of top highway) -->
    <text x="0" y="-66" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.5">CASTOR</text>

    <!-- Microkernel Core Pillars (Centered Directly Below Hub, Clear of bottom highway) -->
    <g transform="translate(-130, 68)">
      <rect width="260" height="22" rx="11" fill="#0b121e" stroke="#1e293b" stroke-width="1"/>
      <text x="130" y="15" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">
        <tspan fill="#38bdf8">DGI Firewall</tspan>
        <tspan fill="#475569">  ·  </tspan>
        <tspan fill="#f8fafc">Zero-Turn Wait</tspan>
        <tspan fill="#475569">  ·  </tspan>
        <tspan fill="#f59e0b">KV Semaphore</tspan>
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RIGHT HUB: LOCAL FRONTIER (AMBER GOLD)                                -->
  <!-- ========================================================================= -->
  <g transform="translate(820, 210)">
    <!-- Halo Glow -->
    <circle cx="0" cy="0" r="60" fill="#1f140a" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="50" fill="#140d06" stroke="#ea580c" stroke-width="1"/>

    <!-- Terminal Monitor Vector Illustration -->
    <g transform="translate(-20, -18)">
      <rect width="40" height="26" rx="4" fill="#0a0704" stroke="url(#amberGlow)" stroke-width="1.5"/>
      <path d="M 16 26 L 13 32 L 27 32 L 24 26 Z" fill="#78350f"/>
      <text x="6" y="13" fill="#fde047" font-size="8" font-family="monospace" font-weight="bold">&gt;_</text>
      <line x1="16" y1="11" x2="32" y2="11" stroke="#f97316" stroke-width="1.2"/>
      <line x1="6" y1="19" x2="26" y2="19" stroke="#60a5fa" stroke-width="1.2"/>
    </g>

    <!-- Local Typography -->
    <text x="0" y="80" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">Local Frontier</text>
    <text x="0" y="98" fill="#94a3b8" font-size="11.5" text-anchor="middle">vLLM · llama.cpp · LM Studio · SGLang</text>

    <!-- In-Tree Tool Loop Pill -->
    <g transform="translate(-100, 110)">
      <rect width="200" height="22" rx="11" fill="#1c0f05" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="100" y="15" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">
        🔄 Tool Loop: read · edit · bash · test
      </text>
    </g>

    <!-- $0 Cost Badge Attached Directly to Local Hub -->
    <g transform="translate(-65, 138)">
      <rect width="130" height="20" rx="5" fill="#451a03" stroke="#d97706" stroke-width="0.8"/>
      <text x="65" y="14" fill="#fef08a" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="0.4">★ $0 CLOUD TOKENS ★</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. BOTTOM VALUE SUMMARY BAR                                              -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 415)">
    <text x="400" y="16" fill="#64748b" font-size="11.5" font-weight="600" text-anchor="middle">
      <tspan fill="#38bdf8">Cloud reasons once</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#f8fafc">Castor bridges in-process</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#f59e0b">Local engine loops for $0</tspan>
      <tspan fill="#334155">  ──►  </tspan>
      <tspan fill="#38bdf8">Only verified diffs return to cloud</tspan>
    </text>
  </g>
</svg>