# ============================================================================
# Castor — Automated Release Pipeline
# ============================================================================
# Triggered on version tags (e.g. `v1.0.0`).
#
# 1. Runs the Rust test gate and clippy check.
# 2. Creates the GitHub Release with generated release notes.
# 3. Publishes `mcp-castor` to npm with OIDC Trusted Publishing (--provenance).
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Verify · Rust stable · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --all-targets

      - name: Run clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests (authoritative gate)
        run: cargo test --verbose

      - name: Test Node shim
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/castor.js --help

  publish:
    name: GitHub Release & NPM Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Extract Tag Version
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.tag }} exists, updating title..."
            gh release edit "${{ steps.meta.outputs.tag }}" \
              --title "Castor ${{ steps.meta.outputs.version }}"
          else
            gh release create "${{ steps.meta.outputs.tag }}" \
              --title "Castor ${{ steps.meta.outputs.version }}" \
              --generate-notes \
              --draft=false \
              --prerelease=false
          fi

      - name: Publish to NPM via OIDC Trusted Publishing
        run: |
          if npm view "mcp-castor@${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "mcp-castor@${{ steps.meta.outputs.version }} is already published on npm, ensuring latest dist-tag..."
            npm dist-tag add "mcp-castor@${{ steps.meta.outputs.version }}" latest || true
          else
            npm publish --access public --provenance --tag release
            npm dist-tag add "mcp-castor@${{ steps.meta.outputs.version }}" latest
          fi

