# ============================================================================
# Castor — Continuous Integration
# ============================================================================
# Authoritative test gate for the Castor Rust microkernel and MCP toolchain.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Rust stable · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --all-targets

      - name: Run clippy (-D warnings, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify slim feature gate compiles (no-default + mcp)
        run: cargo check --no-default-features --features mcp

      - name: Run tests (authoritative gate, all features)
        run: cargo test --all-features

      - name: Test Node shim
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/castor.js --help
