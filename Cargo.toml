[package]
name = "castor"
version = "1.1.1"
edition = "2024"
license = "AGPL-3.0"
description = "Castor: Rust MCP toolchain, proxy, and evo engine"
repository = "https://github.com/ApatheticMioz/Castor"
homepage = "https://github.com/ApatheticMioz/Castor#readme"
keywords = ["mcp", "model-context-protocol", "agent-harness", "rust", "pair-programming"]
categories = ["development-tools", "command-line-utilities", "asynchronous"]

[[bin]]
name = "castor"
path = "src/main.rs"

[dependencies]
ast-grep-core = "0.45"
# The `builtin-parser` feature enables all 28 bundled tree-sitter grammars in
# one shot, so `SupportLang::from_path` can resolve any of them.
ast-grep-language = { version = "0.45", default-features = false, features = ["builtin-parser"] }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-child-process", "transport-io"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
encoding_rs = "0.8.42"
futures-util = "0.3"
thiserror = "2.0.21"
regex = "1"
schemars = "1.2.2"
async-trait = "0.1.92"
libc = "0.2"
html2md = "0.2"
chrono = "0.4"
humantime = "2.1"
path-clean = "1.0"
dunce = "1.0"
base64 = "0.22"
unicode-normalization = "0.1"
infer = "0.16"
# Pure-Rust PDF parsing (no C bindings). 0.42+ carries the RUSTSEC-2026-0187
# recursion-depth fix. Default features disabled to keep the dep lightweight.
lopdf = { version = "0.42", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Kernel-level filesystem confinement for the sandboxed shell child.
# Only applied when the running kernel exposes the Landlock LSM (Linux >= 5.13).
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

